<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OS Tutorial</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #161a21;
    --panel-head: #1d222b;
    --border: #2a303b;
    --gutter: #2a303b;
    --gutter-hover: #4c8dff;
    --text: #d7dce4;
    --text-dim: #8a93a3;

    --console-width: 60%;  /* width of the console column */
    --memory-height: 50%;  /* height of the memory panel */
    --gutter-size: 6px;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 14px;
  }

  body {
    display: flex;
    flex-direction: column;
  }

  /* Top bar */
  #topbar {
    flex: none;
    height: 40px;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 12px;
    border-bottom: 1px solid var(--border);
    background: var(--panel-head);
  }
  #topbar .title { font-weight: 600; }
  #topbar .spacer { flex: 1; }

  /* Main area: console on the left, side column on the right */
  #main {
    flex: 1;
    min-height: 0;
    display: flex;
  }
  #console { flex: 0 0 var(--console-width); }
  #side {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
  }
  #memory { flex: 0 0 var(--memory-height); }
  #boot { flex: 1; }

  /* Panels */
  .panel {
    min-width: 0;
    min-height: 0;
    display: flex;
    flex-direction: column;
    background: var(--panel);
    overflow: hidden;
  }
  .panel-head {
    flex: none;
    height: 28px;
    display: flex;
    align-items: center;
    padding: 0 10px;
    border-bottom: 1px solid var(--border);
    background: var(--panel-head);
    color: var(--text-dim);
    font-size: 12px;
    letter-spacing: 0.04em;
  }
  .panel-body {
    flex: 1;
    min-height: 0;
    overflow: auto;
    padding: 10px;
    color: var(--text-dim);
  }
  #console .panel-body {
    font-family: ui-monospace, Menlo, Consolas, monospace;
  }

  /* Splitters */
  .gutter {
    flex: none;
    background: var(--gutter);
    touch-action: none;
    transition: background 0.15s;
  }
  .gutter:hover,
  .gutter:focus-visible,
  .gutter.dragging {
    background: var(--gutter-hover);
    outline: none;
  }
  .gutter-v { width: var(--gutter-size); cursor: col-resize; }
  .gutter-h { height: var(--gutter-size); cursor: row-resize; }
  body.resizing { user-select: none; }
  body.resizing-v { cursor: col-resize; }
  body.resizing-h { cursor: row-resize; }

  /* Status bar */
  #statusbar {
    flex: none;
    height: 24px;
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 0 12px;
    border-top: 1px solid var(--border);
    background: var(--panel-head);
    color: var(--text-dim);
    font-size: 12px;
  }

  /* Narrow screens: stack panels vertically and hide splitters */
  @media (max-width: 767px) {
    body { height: auto; min-height: 100%; }
    #main, #side { flex-direction: column; }
    #console, #memory, #boot { flex: none; min-height: 260px; }
    .panel + .panel, #side { border-top: 1px solid var(--border); }
    .gutter { display: none; }
  }
</style>
</head>
<body>

<header id="topbar">
  <span class="title">OS Tutorial</span>
  <span class="spacer"></span>
  <span class="placeholder">Day select · Run / Pause / Step</span>
</header>

<main id="main">
  <section id="console" class="panel">
    <div class="panel-head">CONSOLE</div>
    <div class="panel-body">Console area</div>
  </section>

  <div class="gutter gutter-v" role="separator" aria-orientation="vertical"
       aria-label="Resize console width" tabindex="0"
       data-var="--console-width" data-axis="x" data-target="main"></div>

  <div id="side">
    <section id="memory" class="panel">
      <div class="panel-head">MEMORY</div>
      <div class="panel-body">Memory map area</div>
    </section>

    <div class="gutter gutter-h" role="separator" aria-orientation="horizontal"
         aria-label="Resize memory panel height" tabindex="0"
         data-var="--memory-height" data-axis="y" data-target="side"></div>

    <section id="boot" class="panel">
      <div class="panel-head">BOOT · PROCESS · TIME</div>
      <div class="panel-body">Boot steps, processes, and time area</div>
    </section>
  </div>
</main>

<footer id="statusbar">
  <span>Uptime --</span>
  <span>CPU mode --</span>
  <span>tick --</span>
</footer>

<script>
(function () {
  const MIN = 15, MAX = 85;          // each panel keeps at least 15%
  const STORAGE_KEY = 'os-tutorial.layout';
  const root = document.documentElement;
  const defaults = {
    '--console-width': getComputedStyle(root).getPropertyValue('--console-width').trim(),
    '--memory-height': getComputedStyle(root).getPropertyValue('--memory-height').trim(),
  };

  const clamp = (v) => Math.min(MAX, Math.max(MIN, v));

  function setSize(name, percent) {
    root.style.setProperty(name, clamp(percent).toFixed(1) + '%');
  }

  function save() {
    try {
      const data = {};
      for (const name in defaults) data[name] = root.style.getPropertyValue(name);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    } catch (e) {}
  }

  function load() {
    try {
      const data = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
      for (const name in defaults) {
        if (data[name]) root.style.setProperty(name, data[name]);
      }
    } catch (e) {}
  }

  function currentPercent(name) {
    const value = root.style.getPropertyValue(name) || defaults[name];
    return parseFloat(value);
  }

  document.querySelectorAll('.gutter').forEach((gutter) => {
    const name = gutter.dataset.var;
    const axis = gutter.dataset.axis;
    const container = document.getElementById(gutter.dataset.target);

    gutter.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      gutter.setPointerCapture(e.pointerId);
      gutter.classList.add('dragging');
      document.body.classList.add('resizing', axis === 'x' ? 'resizing-v' : 'resizing-h');
    });

    gutter.addEventListener('pointermove', (e) => {
      if (!gutter.hasPointerCapture(e.pointerId)) return;
      const rect = container.getBoundingClientRect();
      const percent = axis === 'x'
        ? (e.clientX - rect.left) / rect.width * 100
        : (e.clientY - rect.top) / rect.height * 100;
      setSize(name, percent);
    });

    const stop = (e) => {
      if (!gutter.hasPointerCapture(e.pointerId)) return;
      gutter.releasePointerCapture(e.pointerId);
      gutter.classList.remove('dragging');
      document.body.classList.remove('resizing', 'resizing-v', 'resizing-h');
      save();
    };
    gutter.addEventListener('pointerup', stop);
    gutter.addEventListener('pointercancel', stop);

    // Double-click resets to the default size
    gutter.addEventListener('dblclick', () => {
      root.style.setProperty(name, defaults[name]);
      save();
    });

    // Keyboard: arrow keys adjust by 2% per press
    gutter.addEventListener('keydown', (e) => {
      const keys = axis === 'x' ? ['ArrowLeft', 'ArrowRight'] : ['ArrowUp', 'ArrowDown'];
      const i = keys.indexOf(e.key);
      if (i === -1) return;
      e.preventDefault();
      setSize(name, currentPercent(name) + (i === 0 ? -2 : 2));
      save();
    });
  });

  load();
})();
</script>
</body>
</html>
