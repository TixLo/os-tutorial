<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OS Tutorial</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/panels.css">
<script type="module" src="js/main.js"></script>
</head>
<body>

<header id="topbar">
  <span class="title">OS Tutorial</span>
  <span class="spacer"></span>
  <span class="placeholder">Day select · Run / Pause / Step</span>
</header>

<main id="main">
  <section id="console" class="panel">
    <div class="panel-head">CONSOLE</div>
    <div class="panel-body">Console area</div>
  </section>

  <div class="gutter gutter-v" role="separator" aria-orientation="vertical"
       aria-label="Resize console width" tabindex="0"
       data-size="consoleWidth" data-css-var="--console-width"
       data-axis="x" data-target="main"></div>

  <div id="side">
    <section id="memory" class="panel">
      <div class="panel-head">MEMORY</div>
      <div class="panel-body">Memory map area</div>
    </section>

    <div class="gutter gutter-h" role="separator" aria-orientation="horizontal"
         aria-label="Resize memory panel height" tabindex="0"
         data-size="memoryHeight" data-css-var="--memory-height"
         data-axis="y" data-target="side"></div>

    <section id="boot" class="panel">
      <div class="panel-head">BOOT · PROCESS · TIME</div>
      <div class="panel-body">Boot steps, processes, and time area</div>
    </section>
  </div>
</main>

<footer id="statusbar">
  <span>Uptime --</span>
  <span>CPU mode --</span>
  <span>tick --</span>
</footer>

</body>
</html>
